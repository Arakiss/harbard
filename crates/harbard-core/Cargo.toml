[package]
name = "harbard-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "3"
time = { version = "0.3", features = ["formatting"] }
gethostname = "1"
fs2 = "0.4"
sha2 = "0.11"
nix = { version = "0.31", features = ["dir", "fs", "signal", "process", "user"] }
# Already in the tree through nix; used directly for macOS `proc_pidinfo`,
# which nix does not wrap (process start markers for liveness).
libc = "0.2"
# Disposable derived index for note search (a conscious trade-off). Bundled
# so satellites do not depend on a system libsqlite3.
rusqlite = { version = "0.41", features = ["bundled"] }
# The Unicode General Category, to drop every format (Cf) and unassigned (Cn)
# code point from what agents read. No dependencies, Apache-2.0.
unicode-general-category = "1.1"
