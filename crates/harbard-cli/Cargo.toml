[package]
name = "harbard-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "harbard_cli"
path = "src/lib.rs"

[[bin]]
name = "harbard"
path = "src/main.rs"

[dependencies]
harbard-core = { path = "../harbard-core" }
clap = { version = "4", features = ["derive"] }
# preserve_order (pulls indexmap): `install` must not reorder a hand-formatted
# config's keys — the only diff on re-install is harbard's own hook groups (M1.1a).
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
ulid = "3"
# tiny_http: a boring, tiny HTTP/1.1 server for `harbard serve`; SSE via a 1 s
# store-polling blocking reader is enough per the contract (no async runtime).
tiny_http = "0.12"
# Satellite → hub HTTP client (M4a). Blocking, boring, no async runtime.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
# ctrlc (termination): graceful SIGINT/SIGTERM shutdown of the serve loop.
ctrlc = { version = "3", features = ["termination"] }
# Constant-time comparison for the hub bearer token.
subtle = "2"
nix = { version = "0.31", features = ["net", "signal"] }
fs2 = "0.4"

[dev-dependencies]
# Integration tests drive the real binary and parse its --json output.
serde_json = { version = "1", features = ["preserve_order"] }
ulid = "3"
