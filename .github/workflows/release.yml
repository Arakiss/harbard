name: release

# Manual: `just release` starts it for a tag that passed the gate.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, such as v0.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-tag:
    name: validate tag
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-${GITHUB_REF#refs/tags/}}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag"
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/tags/${tag}" ]]; then
            echo "::error::Run this workflow from refs/tags/${tag}"
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  binaries:
    name: binary (${{ matrix.target }})
    needs: validate-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: harbard-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: harbard-aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: harbard-x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: harbard-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Install Linux ARM64 cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' > .cargo/config.toml
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target "${{ matrix.target }}" --bin harbard
      - name: Package and checksum
        env:
          ASSET: ${{ matrix.asset }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp "target/${TARGET}/release/harbard" dist/package/harbard
          cp LICENSE README.md dist/package/
          tar -C dist/package -czf "dist/${ASSET}.tar.gz" .
          (cd dist && shasum -a 256 "${ASSET}.tar.gz" > "${ASSET}.tar.gz.sha256")
      - name: Sign and verify
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          artifact="dist/${ASSET}.tar.gz"
          cosign sign-blob --yes "${artifact}" --bundle "${artifact}.sigstore.json"
          cosign verify-blob "${artifact}" \
            --bundle "${artifact}.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: Attest public release artifact
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/${{ matrix.asset }}.tar.gz
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          files: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.tar.gz.sha256
            dist/${{ matrix.asset }}.tar.gz.sigstore.json

  sbom:
    name: sbom
    needs: [validate-tag, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Create release output directory
        run: mkdir -p dist
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/harbard-${{ needs.validate-tag.outputs.tag }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest public SBOM
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/harbard-${{ needs.validate-tag.outputs.tag }}.cdx.json
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          files: dist/harbard-${{ needs.validate-tag.outputs.tag }}.cdx.json
