[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "ISC",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
]
exceptions = [
  # Permissive and MIT-compatible; comes in through rusqlite's hash map.
  { allow = ["Zlib"], crate = "foldhash" },
]
# harbard's own crates are unpublished (publish = false).
private = { ignore = true }

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
