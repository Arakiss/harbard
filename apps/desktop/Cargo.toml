[package]
name = "harbard-app"
version = "0.3.0-alpha.14"
edition = "2024"
license = "MIT"
publish = false
description = "harbard desktop — the native fleet console"

[[bin]]
name = "harbard-app"
path = "src/main.rs"

[dependencies]
harbard-core = { path = "../../crates/harbard-core" }
harbard-cli = { path = "../../crates/harbard-cli" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui-kit = { version = "0.9.1", features = ["gpui-fast"] }
gpui = { package = "gpui-fast", version = "0.1.14" }
anyhow = "1"
async-channel = "2"
ureq = { version = "2", default-features = false, features = ["json"] }
rust-embed = "8"
libc = "0.2"
ulid = "3"
serde_path_to_error = "0.1"
tray-icon = { version = "0.25", default-features = false }
global-hotkey = "0.8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSDockTile", "NSWindow", "NSView", "NSResponder", "NSRunningApplication", "NSGraphics", "NSScreen"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSProcessInfo", "NSBundle", "NSString", "NSArray", "NSGeometry"] }
raw-window-handle = "0.6"
png = "0.18"
imagesize = "0.14"
block2 = "0.6"
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotificationSettings", "UNUserNotificationCenter"] }
image = { version = "0.25", default-features = false, features = ["webp", "png"] }
objc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = false
debug = 1

[workspace]
