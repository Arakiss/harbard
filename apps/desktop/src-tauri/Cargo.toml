[package]
name = "harbard-desktop"
version = "0.3.0-alpha.11"
edition = "2021"
license = "MIT"
publish = false
description = "harbard desktop — tray, notifications, and a dock for the fleet console"

# Deliberately OUTSIDE the root Cargo workspace: the tauri/wry dependency tree
# must not slow or fail the bus's gates (fmt, clippy -D warnings, test, deny).
# Its own lockfile, its own checks. The empty table is the exclusion.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking client on a dedicated thread: the tray polls the loopback API every
# few seconds, a workload that buys nothing from an async runtime.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# The living Dock icon: Tauri has no API for `applicationIconImage`. Already in
# the tree through tao and tauri at these versions, so no new code is fetched.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSData", "NSProcessInfo", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotificationSettings", "UNUserNotificationCenter"] }
block2 = "0.6"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
